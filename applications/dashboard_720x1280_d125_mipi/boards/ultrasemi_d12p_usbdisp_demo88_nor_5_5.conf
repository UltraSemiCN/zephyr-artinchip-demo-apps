# SPDX-License-Identifier: Apache-2.0
#
# LVGL instrument dashboard on UltraSemi D12P USB Display Demo88 NOR 5.5-inch (720x1280 MIPI,
# artinchip,pos-panel),
# without LittleFS resources / touch for bring-up.

CONFIG_GPIO=y
CONFIG_PINCTRL=y

CONFIG_MIPI_DSI=y
CONFIG_DISPLAY=y
CONFIG_DISPLAY_ARTINCHIP_POS_PIPELINE=y
CONFIG_DISPLAY_ARTINCHIP_POS_PANEL=y
CONFIG_ARTINCHIP_POS_PANEL_DEFER_PANEL_INIT=y

CONFIG_INPUT=n
CONFIG_INPUT_GT911=n
CONFIG_LV_Z_POINTER_INPUT=n
CONFIG_LV_Z_ENCODER_INPUT=n
CONFIG_LV_Z_KEYPAD_INPUT=n

CONFIG_LV_Z_AUTO_INIT=y
CONFIG_LV_Z_INIT_PRIORITY=95
# main() owns lv_timer_handler(); do not run a second concurrent handler.
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=n
# Keep interactive shell service ahead of CPU-intensive software rendering.
CONFIG_MAIN_THREAD_PRIORITY=5
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=2


CONFIG_LV_USE_SCALE=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_CHART=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_LED=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_24=y

CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_VDB_SIZE=15
# 720x1280 dashboard needs a larger object heap than Hello World.
CONFIG_LV_Z_MEM_POOL_SIZE=1048576

CONFIG_MAIN_STACK_SIZE=12288
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_LOG_DEFAULT_LEVEL=3
