CONFIG_GPIO_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_PWM_SHELL=y
CONFIG_RTC_SHELL=y
CONFIG_SENSOR_SHELL=y
CONFIG_DEVMEM_SHELL=y
CONFIG_ARTINCHIP_REBOOT_SHELL=y
CONFIG_MIPI_DSI=y
CONFIG_MIPI_DSI_ARTINCHIP_D13X_SHELL=y
CONFIG_DISPLAY=y
CONFIG_DISPLAY_ARTINCHIP_D13X_DE_SHELL=y
CONFIG_VIDEO=y
CONFIG_VIDEO_SHELL=y
CONFIG_VIDEO_ARTINCHIP_D13X_DVP_SHELL=y
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=1048576
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION_NAME="PSRAM"
CONFIG_ARTINCHIP_D13X_USB_SHELL=y

# Sensor values require floating-point formatting.
CONFIG_CBPRINTF_NANO=n
CONFIG_CBPRINTF_COMPLETE=y

# prj_minimal.conf enables CONFIG_SHELL_MINIMAL, which disables Tab handling
# and command completion by default. This debug profile keeps the shell fully
# interactive after leaving bypass mode with ctrl-x ctrl-q.
CONFIG_SHELL_MINIMAL=n
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=y
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=256
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_SHELL_METAKEYS=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_HELP=y
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_PROMPT_UART="uart:~$ "
